<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Phone Inventory · Lopez Tech</title>
<style>
:root{
--sky:#38BDF8;--sky2:#0EA5E9;--sky3:#0284C7;--skybg:#E0F2FE;--skybg2:#F0F9FF;
--bg:#F6F9FC;--surface:#FFFFFF;--surface2:#F8FAFC;
--text:#0F172A;--text2:#475569;--text3:#94A3B8;--border:#E2E8F0;--border2:#CBD5E1;
--green:#16A34A;--greenbg:#DCFCE7;--amber:#D97706;--amberbg:#FEF3C7;--red:#DC2626;--redbg:#FEE2E2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
.app{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit;text-decoration:none}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
.top h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0}
.top .sub{font-size:12.5px;color:var(--text3);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);border-radius:11px;padding:9px 14px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--surface2)}
.btn svg{width:16px;height:16px}
.btn.pri{background:linear-gradient(135deg,var(--sky2),var(--sky3));color:#fff;border:none;box-shadow:0 3px 12px rgba(14,165,233,.32)}
.btn.pri:hover{filter:brightness(1.04)}
.btn.big{padding:11px 16px;font-size:14px;font-weight:800}
.btn.danger{background:var(--redbg);color:var(--red);border-color:transparent}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.stat b{font-size:23px;font-weight:800;display:block;line-height:1;color:var(--text)}
.stat span{font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat.g b{color:var(--green)}
.sold-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:18px}
.ss{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.ss b{font-size:24px;font-weight:800;display:block;line-height:1;color:var(--text)}
.ss span{font-size:11.5px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.ss.g b{color:var(--green)}

/* controls */
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.pill{padding:8px 13px;border:1.5px solid var(--border);background:var(--surface);border-radius:20px;font-size:12.5px;font-weight:700;color:var(--text2);cursor:pointer}
.pill:hover{border-color:var(--sky)}
.pill.on{background:var(--sky2);color:#fff;border-color:var(--sky2)}
.search{margin-left:auto;flex:1;min-width:170px;max-width:280px;height:40px;border:1.5px solid var(--border);border-radius:11px;padding:0 14px;font-size:13.5px;font-family:inherit;background:var(--surface)}
.search:focus{outline:none;border-color:var(--sky2)}

/* brand sections */
.brand-sec{margin-bottom:22px}
.brand-hd{display:flex;align-items:center;gap:9px;margin:0 2px 12px;cursor:pointer;user-select:none}
.brand-hd .nm{font-size:13px;font-weight:800;color:var(--sky3);text-transform:uppercase;letter-spacing:.05em}
.brand-hd .ct{background:var(--skybg);color:var(--sky3);border-radius:20px;padding:1px 9px;font-size:11px;font-weight:800}
.brand-hd .chev{margin-left:2px;color:var(--text3);transition:transform .18s}
.brand-hd.collapsed .chev{transform:rotate(-90deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sub-sec{margin-bottom:15px}
.sub-hd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--text2);margin:2px 2px 10px}
.sub-ct{background:var(--surface2);color:var(--text3);border-radius:20px;padding:1px 8px;font-size:10.5px;font-weight:800}

/* card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:15px 16px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}
.card .nm{font-size:15.5px;font-weight:800;line-height:1.2}
.card .spec{font-size:12.5px;color:var(--text2);margin-top:3px}
.st-sel{border:1.5px solid var(--border);border-radius:20px;padding:4px 8px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;font-family:inherit;background:var(--surface);-webkit-appearance:none;appearance:none;text-align:center}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{font-size:11px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px 8px;font-weight:600}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px;padding-top:12px;border-top:1px solid var(--surface2)}
.price{font-size:18px;font-weight:800;color:var(--green)}
.price small{font-size:11px;color:var(--text3);font-weight:600;margin-left:5px}
.acts{display:flex;gap:7px}
.icbtn{border:1.5px solid var(--border);background:var(--surface);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit}
.icbtn:hover{background:var(--surface2)}
.icbtn.del{padding:6px 9px}
.icbtn.del:hover{background:var(--redbg);color:var(--red);border-color:transparent}
.icbtn svg{width:14px;height:14px}

.empty{text-align:center;color:var(--text3);padding:60px 20px}
.empty .ic{font-size:40px;margin-bottom:10px}
.empty h3{margin:0 0 4px;color:var(--text2);font-size:16px}
.empty p{margin:0;font-size:13px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:18px;backdrop-filter:blur(2px)}
.ov.open{display:flex}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(15,23,42,.28);overflow:hidden}
.modal.sm{max-width:440px}
.m-hdr{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--border)}
.m-hdr h2{font-size:18px;font-weight:800;margin:0;flex:1}
.m-hdr .mclose{background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer;line-height:1}
.m-body{padding:18px 20px;overflow-y:auto}
.m-foot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface2)}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;height:42px;border:1.5px solid var(--border);border-radius:10px;padding:0 12px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--text)}
.fld textarea{height:auto;min-height:66px;padding:10px 12px;resize:vertical;line-height:1.4}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--sky2)}
.frow{display:flex;gap:10px}.frow>*{flex:1}
.req{color:var(--red)}

/* label */
.lblwrap{display:flex;justify-content:center;padding:6px 0 4px}
.lbl{width:2.7in;border:2px solid #000;border-radius:8px;padding:11px 13px;color:#000;background:#fff;font-family:-apple-system,Arial,sans-serif}
.lbl-t{font-size:12.5px;font-weight:900;letter-spacing:.3px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px;line-height:1.25}
.lbl-rows>div{display:flex;font-size:10.5px;margin-bottom:4px;line-height:1.3}
.lbl-rows b{width:78px;flex-shrink:0;font-weight:800;letter-spacing:.3px}
.lbl-rows span{font-weight:800;flex:1;word-break:break-word}
.lbl-price{margin-top:8px;background:#000;color:#fff;border-radius:6px;padding:6px 10px;font-size:17px;font-weight:900;text-align:center;letter-spacing:.5px}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}#toast.ok{background:var(--green)}

@media (max-width:640px){
  .stats{grid-template-columns:1fr 1fr}
  .top h1{font-size:20px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1>Phone Inventory</h1>
      <div class="sub">What's in stock and up for sale</div>
    </div>
    <button class="btn pri big" onclick="openForm(null)"><svg fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add Phone</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="st-stock">0</b><span>In stock</span></div>
    <div class="stat g"><b id="st-sale">0</b><span>For sale</span></div>
    <div class="stat"><b id="st-recv">0</b><span>Received</span></div>
    <div class="stat g"><b id="st-value">$0</b><span>Value</span></div>
  </div>

  <div class="controls">
    <div class="pill on" data-f="all" onclick="setFilter('all')">All</div>
    <div class="pill" data-f="available" onclick="setFilter('available')">For sale</div>
    <div class="pill" data-f="received" onclick="setFilter('received')">Received</div>
    <div class="pill" data-f="sold" onclick="setFilter('sold')">Sold</div>
    <input class="search" id="search" placeholder="🔍  Search model, IMEI, color…" oninput="render()"/>
  </div>

  <div id="inv"></div>
</div>

<!-- ADD / EDIT MODAL -->
<div class="ov" id="ov-form"><div class="modal"><div class="m-hdr"><h2 id="form-title">Add Phone</h2><button class="mclose" onclick="closeForm()">&times;</button></div>
<div class="m-body">
  <div class="fld"><label>Model <span class="req">*</span></label><input id="f-model" placeholder="e.g. iPhone 13, Galaxy S21, Moto G Power"/></div>
  <div class="frow">
    <div class="fld"><label>Storage</label><input id="f-storage" list="dl-storage" placeholder="128GB"/><datalist id="dl-storage"><option>32GB</option><option>64GB</option><option>128GB</option><option>256GB</option><option>512GB</option><option>1TB</option></datalist></div>
    <div class="fld"><label>Color</label><input id="f-color" placeholder="Midnight"/></div>
  </div>
  <div class="frow">
    <div class="fld"><label>Carrier / Unlock</label><input id="f-carrier" list="dl-carrier" placeholder="Unlocked"/><datalist id="dl-carrier"><option>Unlocked</option><option>AT&amp;T</option><option>T-Mobile</option><option>Verizon</option><option>Metro</option><option>Cricket</option></datalist></div>
    <div class="fld"><label>Location</label><select id="f-location"><option value="">— Select —</option><option>Dayton</option><option>Crosby</option></select></div>
  </div>
  <div class="fld"><label>IMEI / SN</label><input id="f-imei" placeholder="Optional"/></div>
  <div class="frow">
    <div class="fld"><label>Battery %</label><input id="f-batt" type="number" min="0" max="100" placeholder="0"/></div>
    <div class="fld"><label>Cycle count</label><input id="f-cycle" type="number" min="0" placeholder="0"/></div>
    <div class="fld"><label>Grade</label><input id="f-grade" list="dl-grade" placeholder="A"/><datalist id="dl-grade"><option>A</option><option>B</option><option>C</option><option>D</option></datalist></div>
  </div>
  <div class="frow">
    <div class="fld"><label>Cost ($)</label><input id="f-cost" type="number" min="0" step="0.01" placeholder="0.00"/></div>
    <div class="fld"><label>Price ($)</label><input id="f-price" type="number" min="0" step="0.01" placeholder="0.00"/></div>
    <div class="fld"><label>Status</label><select id="f-status"><option value="received">Received</option><option value="available">For sale</option><option value="sold">Sold</option></select></div>
  </div>
  <div class="fld"><label>Notes</label><textarea id="f-notes" placeholder="Condition, blemishes, anything worth noting…"></textarea></div>
</div>
<div class="m-foot"><button class="btn danger" id="f-del" onclick="removePhone(editId,true)" style="display:none">Delete</button><button class="btn" onclick="closeForm()" style="margin-left:auto">Cancel</button><button class="btn pri" onclick="saveForm()">Save Phone</button></div>
</div></div>

<!-- LABEL MODAL -->
<div class="ov" id="ov-label"><div class="modal sm"><div class="m-hdr"><h2>Phone Label</h2><button class="mclose" onclick="closeLabel()">&times;</button></div>
<div class="m-body"><div class="lblwrap"><div class="lbl" id="lbl-preview"></div></div></div>
<div class="m-foot"><button class="btn" onclick="closeLabel()">Close</button><button class="btn pri" onclick="printLabel()" style="margin-left:auto"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>Print label</button></div>
</div></div>

<div id="toast"></div>

<script>
/* ══════ FIREBASE (same project as the repair dashboard) ══════ */
const FB={apiKey:"AIzaSyAKeb68narBC-QxnHrw5v346xiCR2Q_Oxo",authDomain:"lopez-tech-repairs-82c87.firebaseapp.com",databaseURL:"https://lopez-tech-repairs-82c87-default-rtdb.firebaseio.com",projectId:"lopez-tech-repairs-82c87"};
let authToken='',refreshTok='',authTmr=null;
function fbBase(){return FB.databaseURL.replace(/\/$/,'');}
function fbUrlFor(p){return fbBase()+'/'+p+'.json'+(authToken?'?auth='+encodeURIComponent(authToken):'');}
async function ensureAuth(){
  try{
    const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
    const d=await r.json();
    if(d&&d.idToken){authToken=d.idToken;refreshTok=d.refreshToken||'';scheduleRefresh(d.expiresIn);}
  }catch(e){/* anon disabled or offline: run tokenless (works on public rules) */}
}
function scheduleRefresh(exp){const ms=Math.max(60000,((parseInt(exp||3600)||3600)-300)*1000);clearTimeout(authTmr);authTmr=setTimeout(refreshAuth,ms);}
async function refreshAuth(){
  if(!refreshTok)return ensureAuth();
  try{
    const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(refreshTok)});
    const d=await r.json();
    if(d&&d.id_token){authToken=d.id_token;refreshTok=d.refresh_token||refreshTok;scheduleRefresh(d.expires_in);}
  }catch(e){}
}
async function fbFetch(path,opts,retry){
  const res=await fetch(fbUrlFor(path),opts);
  if((res.status===401||res.status===403)&&!retry){await ensureAuth();return fbFetch(path,opts,true);}
  return res;
}
async function fbGet(path){const r=await fbFetch(path);if(!r.ok)throw new Error('read '+r.status);return r.json();}
async function fbPut(path,obj){const r=await fbFetch(path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});if(!r.ok)throw new Error('write '+r.status);return r;}
async function fbPost(path,obj){const r=await fbFetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});if(!r.ok)throw new Error('post '+r.status);return r.json();}
async function fbDel(path){try{await fbFetch(path,{method:'DELETE'});}catch(e){}}

/* ══════ DATA ══════ */
const BRAND_ORDER=['Apple','Samsung','Motorola','Google','OnePlus','Other'];
const STATUSES={received:{label:'Received',color:'#0369A1',bg:'#E0F2FE'},available:{label:'For sale',color:'#15803D',bg:'#DCFCE7'},sold:{label:'Sold',color:'#475569',bg:'#F1F5F9'}};
let phones={};           // id -> phone
let filter='all';
let editId=null;
const collapsed={};      // brand -> true if collapsed

function getBrand(model){
  const m=(model||'').toLowerCase();
  if(m.includes('iphone')||m.includes('ipad')||m.includes('macbook')||m.startsWith('apple')||(m.includes('watch')&&!m.includes('samsung')))return 'Apple';
  if(m.includes('samsung')||m.includes('galaxy'))return 'Samsung';
  if(m.includes('motorola')||m.startsWith('moto '))return 'Motorola';
  if(m.includes('google')||m.includes('pixel'))return 'Google';
  if(m.includes('oneplus')||m.includes('one plus'))return 'OnePlus';
  return 'Other';
}
function subGroup(brand,model){
  const m=(model||'').toLowerCase();
  if(brand==='Apple'){
    if(m.includes('watch'))return 'Apple Watch';
    if(m.includes('ipad'))return 'iPad';
    if(m.includes('macbook'))return 'MacBook';
    if(m.includes('airpod'))return 'AirPods';
    if(m.includes('iphone')){const t=m.match(/iphone\s*(1[0-9]|[4-9]|se|xs|xr|x)/);if(t){const g=t[1];return 'iPhone '+(/^\d+$/.test(g)?g:g.toUpperCase());}return 'iPhone';}
    return 'Other Apple';
  }
  if(brand==='Samsung'){
    if(m.match(/galaxy\s*z/)||m.includes('z fold')||m.includes('z flip'))return 'Galaxy Z';
    if(m.includes('note'))return 'Galaxy Note';
    if(m.includes('tab'))return 'Galaxy Tab';
    if(m.includes('watch'))return 'Galaxy Watch';
    if(/galaxy\s*s/.test(m))return 'Galaxy S';
    if(/galaxy\s*a/.test(m))return 'Galaxy A';
    return 'Galaxy';
  }
  if(brand==='Motorola'){
    if(m.includes('razr'))return 'Razr';
    if(m.includes('edge'))return 'Moto Edge';
    if(/moto\s*g/.test(m))return 'Moto G';
    if(/moto\s*e/.test(m))return 'Moto E';
    return 'Motorola';
  }
  if(brand==='Google'){const p=m.match(/pixel\s*(\d+)/);return p?'Pixel '+p[1]:'Pixel';}
  if(brand==='OnePlus')return 'OnePlus';
  const first=(model||'').trim().split(/\s+/)[0];return first||'Other';
}
function numOf(l){const m=l.match(/(\d+)/);return m?parseInt(m[1]):null;}
function subSort(a,b){const na=numOf(a),nb=numOf(b);if(na!==null&&nb!==null)return nb-na;if(na!==null)return -1;if(nb!==null)return 1;return a.localeCompare(b);}
// map any legacy status (e.g. inrepair) into our 3 buckets
function bucket(p){const s=(p&&p.status)||'received';if(s==='sold')return 'sold';if(s==='available')return 'available';return 'received';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){const v=parseFloat(n)||0;return '$'+v.toLocaleString('en-US',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2});}
function last4(s){s=(s||'').replace(/\s/g,'');return s?'…'+s.slice(-4):'';}

/* ══════ LOAD ══════ */
async function load(){
  try{const d=await fbGet('phones');phones=d&&typeof d==='object'?d:{};}
  catch(e){phones={};toast('Could not load inventory','err');}
  render();
}

/* ══════ RENDER ══════ */
function matches(p){
  const b=bucket(p);
  if(filter==='sold'){if(b!=='sold')return false;}
  else if(b==='sold')return false;
  else if(filter!=='all'&&b!==filter)return false;
  const q=(document.getElementById('search').value||'').trim().toLowerCase();
  if(!q)return true;
  return [p.model,p.color,p.storage,p.imei,p.carrier,p.grade,p.location].some(v=>(v||'').toString().toLowerCase().includes(q));
}
function render(){
  updateStats();
  const entries=Object.entries(phones).filter(e=>matches(e[1]));
  const wrap=document.getElementById('inv');
  let head='';
  if(filter==='sold'){
    const sold=Object.values(phones).filter(p=>bucket(p)==='sold');
    const rev=sold.reduce((s,p)=>s+(parseFloat(p.soldPrice||p.price)||0),0);
    const made=sold.reduce((s,p)=>s+((parseFloat(p.soldPrice||p.price)||0)-(parseFloat(p.cost)||0)),0);
    head='<div class="sold-summary"><div class="ss"><b>'+sold.length+'</b><span>Phones sold</span></div><div class="ss"><b>'+money(rev)+'</b><span>Total sold</span></div><div class="ss g"><b>'+money(made)+'</b><span>Total made</span></div></div>';
  }
  if(!entries.length){const msg=filter==='sold'?'No phones marked sold yet.':(Object.keys(phones).length?'Try a different filter or search.':'Add your first phone with the button up top.');wrap.innerHTML=head+'<div class="empty"><div class="ic">📱</div><h3>No phones found</h3><p>'+msg+'</p></div>';return;}
  // group by brand
  const byBrand={};BRAND_ORDER.forEach(b=>byBrand[b]=[]);
  entries.forEach(e=>{const b=getBrand(e[1].model);(byBrand[b]=byBrand[b]||[]).push(e);});
  let html='';
  BRAND_ORDER.forEach(brand=>{
    const list=byBrand[brand];if(!list||!list.length)return;
    // newest first within a brand
    list.sort((a,b)=>(b[1].created||0)-(a[1].created||0));
    const col=collapsed[brand]!==false;
    let body='';
    if(!col){
      const subs={};
      list.forEach(e=>{const sg=subGroup(brand,e[1].model);(subs[sg]=subs[sg]||[]).push(e);});
      body=Object.keys(subs).sort(subSort).map(sn=>{
        const arr=subs[sn].sort((a,b)=>(b[1].created||0)-(a[1].created||0));
        return '<div class="sub-sec"><div class="sub-hd">'+esc(sn)+'<span class="sub-ct">'+arr.length+'</span></div><div class="grid">'+arr.map(e=>cardHtml(e[0],e[1])).join('')+'</div></div>';
      }).join('');
    }
    html+='<div class="brand-sec">'
      +'<div class="brand-hd'+(col?' collapsed':'')+'" onclick="toggleBrand(\''+brand+'\')"><span class="nm">'+brand+'</span><span class="ct">'+list.length+'</span><span class="chev"><svg fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M6 9l6 6 6-6"/></svg></span></div>'
      +(col?'':body)
      +'</div>';
  });
  wrap.innerHTML=head+html;
}
function cardHtml(id,p){
  const b=bucket(p);const st=STATUSES[b];
  const spec=[p.storage,p.color,p.carrier].filter(Boolean).join(' · ')||'—';
  const tags=[];
  if(p.batt)tags.push('Battery '+p.batt+'%');
  if(p.grade)tags.push('Grade '+p.grade);
  if(p.imei)tags.push('IMEI '+last4(p.imei));
  if(p.location)tags.push('📍 '+p.location);
  const opts=Object.keys(STATUSES).map(k=>'<option value="'+k+'"'+(k===b?' selected':'')+'>'+STATUSES[k].label+'</option>').join('');
  return '<div class="card">'
    +'<div class="card-top"><div><div class="nm">'+esc(p.model||'Unknown model')+'</div><div class="spec">'+esc(spec)+'</div></div>'
    +'<select class="st-sel" style="color:'+st.color+';background:'+st.bg+';border-color:'+st.bg+'" onchange="changeStatus(\''+id+'\',this.value)" onclick="event.stopPropagation()">'+opts+'</select></div>'
    +(tags.length?'<div class="meta">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>':'<div style="height:6px"></div>')
    +'<div class="card-foot"><div class="price">'+money(p.price)+(p.cost?'<small>cost '+money(p.cost)+'</small>':'')+'</div>'
    +'<div class="acts"><button class="icbtn" onclick="openForm(\''+id+'\')">Edit</button>'
    +'<button class="icbtn" onclick="openLabel(\''+id+'\')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>Label</button>'
    +'<button class="icbtn del" title="Delete from stock" onclick="removePhone(\''+id+'\')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg></button></div></div>'
    +'</div>';
}
function toggleBrand(b){collapsed[b]=(collapsed[b]===false);render();}
function updateStats(){
  const all=Object.values(phones);
  const notSold=all.filter(p=>bucket(p)!=='sold');
  set('st-stock',notSold.length);
  set('st-sale',all.filter(p=>bucket(p)==='available').length);
  set('st-recv',all.filter(p=>bucket(p)==='received').length);
  set('st-value',money(notSold.reduce((s,p)=>s+(parseFloat(p.price)||0),0)));
}
function set(id,v){const el=document.getElementById(id);if(el)el.textContent=v;}
function setFilter(f){filter=f;document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',p.dataset.f===f));render();}

/* ══════ STATUS QUICK-CHANGE ══════ */
async function changeStatus(id,status){
  const p=phones[id];if(!p)return;
  if(status==='sold'&&bucket(p)!=='sold'){
    const v=prompt('Sold for how much? ($)',(p.soldPrice||p.price||0));
    if(v===null){render();return;}
    p.soldPrice=parseFloat(v)||0;
  }
  p.status=status;
  render();
  try{await fbPut('phones/'+id,p);}catch(e){toast('Save failed','err');}
}

/* ══════ ADD / EDIT ══════ */
function openForm(id){
  editId=id;
  const p=id?phones[id]:null;
  document.getElementById('form-title').textContent=id?'Edit Phone':'Add Phone';
  document.getElementById('f-del').style.display=id?'inline-flex':'none';
  const g=(f,v)=>document.getElementById(f).value=v==null?'':v;
  g('f-model',p&&p.model);g('f-storage',p&&p.storage);g('f-color',p&&p.color);g('f-carrier',p&&p.carrier);
  g('f-location',p&&p.location);g('f-imei',p&&p.imei);g('f-batt',p&&p.batt);g('f-cycle',p&&p.cycle);g('f-grade',p&&p.grade);
  g('f-cost',p&&p.cost);g('f-price',p&&p.price);g('f-notes',p&&p.notes);
  document.getElementById('f-status').value=p?bucket(p):'received';
  document.getElementById('ov-form').classList.add('open');
}
function closeForm(){document.getElementById('ov-form').classList.remove('open');editId=null;}
async function saveForm(){
  const model=(document.getElementById('f-model').value||'').trim();
  if(!model){toast('Model is required','err');return;}
  const base=editId?Object.assign({},phones[editId]):{created:Date.now()};
  const payload=Object.assign(base,{
    model:model,
    storage:(document.getElementById('f-storage').value||'').trim(),
    color:(document.getElementById('f-color').value||'').trim(),
    carrier:(document.getElementById('f-carrier').value||'').trim(),
    location:document.getElementById('f-location').value,
    imei:(document.getElementById('f-imei').value||'').trim(),
    batt:parseInt(document.getElementById('f-batt').value)||0,
    cycle:parseInt(document.getElementById('f-cycle').value)||0,
    grade:(document.getElementById('f-grade').value||'').trim(),
    cost:parseFloat(document.getElementById('f-cost').value)||0,
    price:parseFloat(document.getElementById('f-price').value)||0,
    status:document.getElementById('f-status').value,

  });
  try{
    if(editId){phones[editId]=payload;await fbPut('phones/'+editId,payload);}
    else{const res=await fbPost('phones',payload);phones[res.name]=payload;}
    closeForm();render();toast(editId?'Saved ✓':'Phone added ✓','ok');
  }catch(e){toast('Save failed','err');}
}
async function removePhone(id,fromModal){
  if(!id||!phones[id])return;
  if(!confirm('Delete this phone from inventory? This cannot be undone.'))return;
  delete phones[id];
  if(fromModal)closeForm();
  render();
  await fbDel('phones/'+id);toast('Phone deleted','ok');
}

/* ══════ LABEL ══════ */
function labelInner(p){
  const title=[p.model,p.color,p.storage].filter(Boolean).join(' · ').toUpperCase();
  const rows=[
    ['IMEI/SN',p.imei||'—'],
    ['CARRIER',(p.carrier||'—').toUpperCase()],
    ['BATTERY',(p.batt?p.batt+'%':'—')+(p.cycle?' · CC '+p.cycle:'')],

  ];
  return '<div class="lbl-t">'+esc(title||'PHONE')+'</div><div class="lbl-rows">'
    +rows.map(r=>'<div><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></div>').join('')
    +'</div><div class="lbl-price">'+money(p.price)+'</div>';
}
let labelId=null;
function openLabel(id){const p=phones[id];if(!p)return;labelId=id;document.getElementById('lbl-preview').innerHTML=labelInner(p);document.getElementById('ov-label').classList.add('open');}
function closeLabel(){document.getElementById('ov-label').classList.remove('open');}
function printLabel(){
  const p=phones[labelId];if(!p)return;
  const css='@page{size:2.9in auto;margin:5mm}body{margin:0;font-family:-apple-system,Arial,sans-serif}'
    +'.lbl{width:2.7in;border:2px solid #000;border-radius:8px;padding:11px 13px;color:#000}'
    +'.lbl-t{font-size:12.5px;font-weight:900;letter-spacing:.3px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px;line-height:1.25}'
    +'.lbl-rows>div{display:flex;font-size:10.5px;margin-bottom:4px}.lbl-rows b{width:78px;flex-shrink:0;font-weight:800}.lbl-rows span{font-weight:800;flex:1;word-break:break-word}'
    +'.lbl-price{margin-top:8px;background:#000;color:#fff;border-radius:6px;padding:6px 10px;font-size:17px;font-weight:900;text-align:center}';
  doPrint('<div class="lbl">'+labelInner(p)+'</div>',css);
}
function doPrint(html,css){
  const f=document.createElement('iframe');
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  const d=f.contentWindow.document;
  d.open();d.write('<html><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+html+'</body></html>');d.close();
  f.contentWindow.focus();
  setTimeout(function(){try{f.contentWindow.print();}catch(e){}setTimeout(function(){f.remove();},600);},250);
}

/* ══════ MISC ══════ */
let toastTmr=null;
function toast(msg,kind){const t=document.getElementById('toast');t.textContent=msg;t.className='show'+(kind?' '+kind:'');clearTimeout(toastTmr);toastTmr=setTimeout(()=>t.className='',2600);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.ov.open').forEach(o=>o.classList.remove('open'));}});

/* ══════ BOOT ══════ */
(async function(){await ensureAuth();await load();})();
</script>
